name: Update widget data
on:
  schedule:
    - cron: "0 16 * * *"   # KST 01:00
  workflow_dispatch:
    inputs:
      months_back:
        description: "수집 개월 수 (비워두면 24개월)"
        required: false
        default: ""
permissions:
  contents: write
concurrency: update-data
env:
  TZ: Asia/Seoul
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt

      # ── 국토부 API 응답 캐시 + 지오코딩 캐시 ──
      # 캐시 경로가 automation/data/cache 라 기존 git add 로는 저장이 안 됐음.
      # Actions 캐시로 붙여서 매 실행마다 전량 재호출하는 걸 막는다.
      # geocode_cache.json도 같이 태운다 — 안 그러면 매일 지번 1,000여 건을 다시 부른다.
      - name: Restore MOLIT cache
        uses: actions/cache@v4
        with:
          path: |
            automation/data/cache
            automation/data/geocode_cache.json
          key: molit-cache-${{ github.run_id }}
          restore-keys: |
            molit-cache-

      # ── 수집 범위 결정 ──
      # 기본은 24개월. 수동 실행 시 months_back 입력으로만 덮어쓸 수 있다.
      - name: Decide months_back
        id: mb
        run: |
          if [ -n "${{ github.event.inputs.months_back }}" ]; then
            MB="${{ github.event.inputs.months_back }}"
          else
            MB=24
          fi
          echo "months=$MB" >> $GITHUB_OUTPUT
          echo "수집 개월: $MB"

      # ── 이전 CSV 복원 (2026.08.13 추가) ──
      # CSV는 레포 루트(molit_kangseo.csv)에만 커밋되고 automation/data/ 는 비어 있어서,
      # 수집이 실패했을 때 "기존 CSV로 계속 진행" 폴백이 한 번도 작동하지 않았다.
      # 국토부 API 장애 시에도 어제 데이터로 위젯·도구 빌드는 이어가게 한다.
      - name: Seed previous CSV
        run: |
          mkdir -p automation/data
          if [ ! -f automation/data/molit_kangseo.csv ] && [ -f molit_kangseo.csv ]; then
            cp molit_kangseo.csv automation/data/molit_kangseo.csv
            echo "이전 CSV 복원: $(wc -l < automation/data/molit_kangseo.csv)행"
          else
            echo "복원 생략 (이미 있거나 루트에 CSV 없음)"
          fi

      # ── 수집 실패해도 뒤 단계는 계속 진행 ──
      # 기존 CSV가 있으면 그걸로 위젯·대시보드를 다시 만들어 서비스가 멈추지 않게 한다.
      - name: Collect MOLIT data (강서)
        id: collect
        continue-on-error: true
        working-directory: automation
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
          MONTHS_BACK: ${{ steps.mb.outputs.months }}
          USE_CACHE: "1"
        run: python collect_kangseo.py

      - name: Check CSV exists
        working-directory: automation
        run: |
          if [ ! -f data/molit_kangseo.csv ]; then
            echo "::error::수집 실패했고 기존 CSV도 없습니다"
            exit 1
          fi
          echo "CSV 행수: $(wc -l < data/molit_kangseo.csv)"
          if [ "${{ steps.collect.outcome }}" != "success" ]; then
            echo "::warning::수집 단계 실패 — 기존 CSV로 빌드를 계속합니다"
          fi

      - name: Build widget_data.json
        working-directory: automation
        run: |
          python widget_data_builder.py data/molit_kangseo.csv 화곡동
          cp outputs/widget/widget_data.json ../widget_data.json
      - name: Build hwagok_apt_data.json
        working-directory: automation
        run: |
          python apt_widget_builder.py data/molit_kangseo.csv 화곡동
          cp outputs/widget/hwagok_apt_data.json ../hwagok_apt_data.json
      - name: Build 강서 아파트 탐색기 (위젯·대시보드)
        run: python gangseo_apt_builder.py automation/data/molit_kangseo.csv .

      # ── 경매 도구 데이터 (지번 → 좌표 지오코딩 포함) ──
      # KAKAO_REST_KEY가 없거나 호출이 실패해도 좌표만 비고 나머지는 정상 생성된다.
      - name: Build auction_data.json
        working-directory: automation
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: |
          python auction_data.py data/molit_kangseo.csv
          cp auction_data.json ../auction_data.json

      - name: Publish CSV
        run: cp automation/data/molit_kangseo.csv molit_kangseo.csv

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add widget_data.json hwagok_apt_data.json gangseo_apt_summary.json gangseo_apt_detail.json auction_data.json molit_kangseo.csv 2>/dev/null || true
          git commit -m "auto: data ($(date +%F))" || echo "변경 없음"
          git pull --rebase --autostash || true
          git push || echo "푸시 생략"

      # ── 수집이 실패했으면 워크플로를 실패로 표시 (알림용) ──
      # 단, 위 단계에서 CSV·위젯은 이미 갱신·커밋된 뒤라 서비스는 정상.
      - name: Report collect failure
        if: steps.collect.outcome != 'success'
        run: |
          echo "::error::MOLIT 수집 단계가 실패했습니다. 국토부 API 상태를 확인하세요."
          exit 1