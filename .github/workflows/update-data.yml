name: Update widget data
on:
  schedule:
    - cron: "0 16 * * *"   # KST 01:00
  workflow_dispatch:
    inputs:
      months_back:
        description: "수집 개월 수 (비워두면 24개월)"
        required: false
        default: ""
  push:
    branches:
      - main
    paths:
      - "automation/collect_kangseo.py"
      - "automation/auction_data.py"
      - "automation/nearby_rent_status.py"
      - "gangseo_apt_builder.py"
      - ".github/workflows/update-data.yml"
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: true
env:
  TZ: Asia/Seoul
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt

      - name: Restore MOLIT and geocode cache
        uses: actions/cache@v4
        with:
          path: |
            automation/data/cache
            automation/data/geocode_cache.json
          key: molit-cache-${{ github.run_id }}
          restore-keys: |
            molit-cache-
            geo-rebuild-

      - name: Decide months_back
        id: mb
        run: |
          if [ -n "${{ github.event.inputs.months_back }}" ]; then
            MB="${{ github.event.inputs.months_back }}"
          else
            MB=24
          fi
          echo "months=$MB" >> $GITHUB_OUTPUT
          echo "수집 개월: $MB"

      - name: Seed previous CSV
        run: |
          mkdir -p automation/data
          if [ ! -f automation/data/molit_kangseo.csv ] && [ -f molit_kangseo.csv ]; then
            cp molit_kangseo.csv automation/data/molit_kangseo.csv
            echo "이전 CSV 복원: $(wc -l < automation/data/molit_kangseo.csv)행"
          else
            echo "복원 생략 (이미 있거나 루트에 CSV 없음)"
          fi

      - name: Collect MOLIT data (강서)
        id: collect
        continue-on-error: true
        working-directory: automation
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
          MONTHS_BACK: ${{ steps.mb.outputs.months }}
          USE_CACHE: "1"
        run: python collect_kangseo.py

      - name: Check CSV exists
        working-directory: automation
        run: |
          if [ ! -f data/molit_kangseo.csv ]; then
            echo "::error::수집 실패했고 기존 CSV도 없습니다"
            exit 1
          fi
          echo "CSV 행수: $(wc -l < data/molit_kangseo.csv)"
          if [ "${{ steps.collect.outcome }}" != "success" ]; then
            echo "::warning::수집 단계 실패 — 기존 CSV로 빌드를 계속합니다"
          fi

      - name: Build widget_data.json
        working-directory: automation
        run: |
          python widget_data_builder.py data/molit_kangseo.csv 화곡동
          cp outputs/widget/widget_data.json ../widget_data.json

      - name: Build hwagok_apt_data.json
        working-directory: automation
        run: |
          python apt_widget_builder.py data/molit_kangseo.csv 화곡동
          cp outputs/widget/hwagok_apt_data.json ../hwagok_apt_data.json

      - name: Build auction and nearby-rent geo data
        working-directory: automation
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          GEO_WORKERS: "8"
          GEO_TIMEOUT: "8"
          GEO_RETRIES: "3"
        run: |
          python auction_data.py data/molit_kangseo.csv
          cp auction_data.json ../auction_data.json

      - name: Write nearby-rent QA report
        run: python automation/nearby_rent_status.py auction_data.json nearby_rent_status.json

      - name: Build 강서 아파트 탐색기
        run: python gangseo_apt_builder.py automation/data/molit_kangseo.csv .

      - name: Validate geo outputs
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path

          auction = json.loads(Path("auction_data.json").read_text(encoding="utf-8"))
          geo = auction.get("geo") or {}
          assert geo, "auction_data geo is empty"

          rentals = list(auction.get("jeonse", [])) + list(auction.get("wolse", []))
          with_j = [r for r in rentals if r.get("u") and r.get("j")]
          with_geo = [r for r in with_j if f"{r['u']} {r['j']}" in geo]
          assert len(with_j) > 1000, f"rental records with jibun too low: {len(with_j)}"
          assert len(with_geo) > 1000, f"rental coordinate coverage too low: {len(with_geo)}"
          coverage = len(with_geo) / len(with_j)
          assert coverage >= 0.50, f"rental coordinate coverage ratio too low: {coverage:.1%}"

          lat0, lng0 = 37.5414336177, 126.8404964502
          def dist(lat1,lng1,lat2,lng2):
              R=6371000
              p1,p2=math.radians(lat1),math.radians(lat2)
              dp=math.radians(lat2-lat1); dl=math.radians(lng2-lng1)
              x=math.sin(dp/2)**2+math.cos(p1)*math.cos(p2)*math.sin(dl/2)**2
              return 2*R*math.asin(math.sqrt(x))

          nearby = []
          for r in auction.get('wolse', []):
              try:
                  area=float(r.get('a') or 0)
              except Exception:
                  continue
              if abs(area-30) > 8:
                  continue
              xy=geo.get(f"{r.get('u','')} {r.get('j','')}")
              if not xy:
                  continue
              if dist(lat0,lng0,float(xy[0]),float(xy[1])) <= 800:
                  nearby.append(r)
          assert nearby, "Hwagok Station nearby monthly-rent sample is zero"

          apt = json.loads(Path("gangseo_apt_summary.json").read_text(encoding="utf-8"))
          complexes = apt.get("complexes", [])
          with_apt_geo = sum(1 for c in complexes if c.get("lat") and c.get("lng"))
          assert complexes, "apartment complexes empty"
          assert with_apt_geo > 600, f"apartment coordinates too low: {with_apt_geo}"

          print(f"geo keys: {len(geo)}")
          print(f"rental rows with jibun: {len(with_j)}/{len(rentals)}")
          print(f"rental rows with coordinates: {len(with_geo)}/{len(with_j)} ({coverage:.1%})")
          print(f"Hwagok monthly sample within 800m: {len(nearby)}")
          print(f"apartment coordinates: {with_apt_geo}/{len(complexes)}")
          PY

      - name: Publish CSV
        run: cp automation/data/molit_kangseo.csv molit_kangseo.csv

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 다른 자동화가 같은 시간에 main을 갱신했으면 먼저 최신 main 위로 이동한다.
          # 충돌을 숨긴 채 detached HEAD에서 push를 시도하지 않는다.
          git pull --rebase --autostash

          git add widget_data.json hwagok_apt_data.json gangseo_apt_summary.json gangseo_apt_detail.json auction_data.json nearby_rent_status.json molit_kangseo.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -m "auto: data ($(date +%F))"
          git push

      - name: Report collect failure
        if: steps.collect.outcome != 'success'
        run: |
          echo "::error::MOLIT 수집 단계가 실패했습니다. 국토부 API 상태를 확인하세요."
          exit 1
