name: Check nearby rent health once
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-nearby-rent-once.yml"
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Measure current nearby-rent coverage
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          p=Path('auction_data.json')
          a=json.loads(p.read_text(encoding='utf-8'))
          geo=a.get('geo',{})
          lat0,lng0=37.5414336177,126.8404964502
          def dist(lat1,lng1,lat2,lng2):
              R=6371000
              p1,p2=math.radians(lat1),math.radians(lat2)
              dp=math.radians(lat2-lat1); dl=math.radians(lng2-lng1)
              x=math.sin(dp/2)**2+math.cos(p1)*math.cos(p2)*math.sin(dl/2)**2
              return 2*R*math.asin(math.sqrt(x))
          def stats(rows):
              with_j=[r for r in rows if r.get('j')]
              with_geo=[r for r in with_j if f"{r.get('u','')} {r.get('j','')}" in geo]
              return {'total':len(rows),'with_j':len(with_j),'with_geo':len(with_geo)}
          near=[]
          for r in a.get('wolse',[]):
              try: area=float(r.get('a') or 0)
              except: continue
              if abs(area-30)>8 or not r.get('j'): continue
              xy=geo.get(f"{r.get('u','')} {r.get('j','')}")
              if not xy: continue
              d=dist(lat0,lng0,float(xy[0]),float(xy[1]))
              if d<=800:
                  near.append((d,r))
          near.sort(key=lambda x:x[0])
          out={
              'updated':a.get('updated'),
              'geo_keys':len(geo),
              'wolse':stats(a.get('wolse',[])),
              'jeonse':stats(a.get('jeonse',[])),
              'hwagok_station_30m2':{
                  'within_500m':sum(1 for d,_ in near if d<=500),
                  'within_800m':len(near),
                  'samples':[{
                      'distance_m':round(d),'dong':r.get('u'),'jibun':r.get('j'),'type':r.get('t'),'area':r.get('a'),
                      'deposit':r.get('dp'),'rent':r.get('m'),'ym':r.get('ym'),'day':r.get('d'),'building':r.get('b')
                  } for d,r in near[:5]]
              }
          }
          Path('nearby-rent-health.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nearby-rent-health.json
          git commit -m "test: nearby rent health" || exit 0
          git pull --rebase --autostash || true
          git push
