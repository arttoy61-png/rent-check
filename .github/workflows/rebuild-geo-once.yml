name: Rebuild geo data once
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rebuild-geo-once.yml"
permissions:
  contents: write
concurrency:
  group: geo-rebuild-once
  cancel-in-progress: true
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore geocode cache
        uses: actions/cache@v4
        with:
          path: automation/data/geocode_cache.json
          key: geo-rebuild-${{ github.run_id }}
          restore-keys: |
            molit-cache-
            geo-rebuild-
      - name: Build auction rental geo data
        working-directory: automation
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: |
          mkdir -p data
          python auction_data.py ../molit_kangseo.csv
          cp auction_data.json ../auction_data.json
      - name: Build apartment geo data
        run: python gangseo_apt_builder.py molit_kangseo.csv .
      - name: Validate real geo coverage and Hwagok sample
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          a=json.loads(Path('auction_data.json').read_text(encoding='utf-8'))
          rentals=list(a.get('jeonse',[]))+list(a.get('wolse',[]))
          with_j=[r for r in rentals if r.get('j')]
          with_xy=[r for r in with_j if f"{r.get('u','')} {r.get('j','')}" in a.get('geo',{})]
          apt=json.loads(Path('gangseo_apt_summary.json').read_text(encoding='utf-8'))
          complexes=apt.get('complexes',[])
          apt_xy=[c for c in complexes if c.get('lat') and c.get('lng')]
          # 화곡역: 서울 강서구 화곡로 지하168 / 화곡동 1089-54
          lat0,lng0=37.5414336177,126.8404964502
          def dist(lat1,lng1,lat2,lng2):
              R=6371000
              p1,p2=math.radians(lat1),math.radians(lat2)
              dp=math.radians(lat2-lat1); dl=math.radians(lng2-lng1)
              x=math.sin(dp/2)**2+math.cos(p1)*math.cos(p2)*math.sin(dl/2)**2
              return 2*R*math.asin(math.sqrt(x))
          nearby=[]
          for r in a.get('wolse',[]):
              try:
                  area=float(r.get('a') or 0)
              except: continue
              if abs(area-30)>8: continue
              k=f"{r.get('u','')} {r.get('j','')}"
              xy=a.get('geo',{}).get(k)
              if not xy: continue
              d=dist(lat0,lng0,float(xy[0]),float(xy[1]))
              if d<=500: nearby.append((round(d),r))
          nearby.sort(key=lambda x:x[0])
          report={
            'rental_rows':len(rentals),
            'rental_with_jibun':len(with_j),
            'rental_with_coordinates':len(with_xy),
            'geo_keys':len(a.get('geo',{})),
            'apartment_complexes':len(complexes),
            'apartment_with_coordinates':len(apt_xy),
            'hwagok_station_monthly_30m2_within_500m':len(nearby),
            'hwagok_samples':[{
              'distance_m':d,'dong':r.get('u'),'jibun':r.get('j'),'type':r.get('t'),
              'area':r.get('a'),'deposit':r.get('dp'),'rent':r.get('m'),'ym':r.get('ym'),'day':r.get('d'),'building':r.get('b')
            } for d,r in nearby[:5]],
            'apartment_samples':[{'name':c.get('nm'),'dong':c.get('dong'),'lat':c.get('lat'),'lng':c.get('lng')} for c in apt_xy[:8]],
          }
          Path('geo-qa-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          assert len(with_j)>0, 'rental jibun missing'
          assert len(with_xy)>1000, 'rental coordinate coverage too low'
          assert len(apt_xy)>600, 'apartment coordinate coverage too low'
          assert len(nearby)>0, 'Hwagok Station 30m2 monthly sample still zero'
          PY
      - name: Commit rebuilt data and QA report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add auction_data.json gangseo_apt_summary.json gangseo_apt_detail.json geo-qa-report.json
          git commit -m "data: rebuild Kakao rental and apartment geo" || echo "no changes"
          git pull --rebase --autostash || true
          git push
