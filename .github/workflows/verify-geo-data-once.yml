name: Verify geo data once
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-geo-data-once.yml"
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify current published geo data
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          a=json.loads(Path('auction_data.json').read_text(encoding='utf-8'))
          geo=a.get('geo') or {}
          rent=list(a.get('jeonse',[]))+list(a.get('wolse',[]))
          with_j=[r for r in rent if r.get('u') and r.get('j')]
          with_geo=[r for r in with_j if f"{r['u']} {r['j']}" in geo]
          lat0,lng0=37.5414336177,126.8404964502
          def dist(lat1,lng1,lat2,lng2):
            R=6371000
            p1,p2=math.radians(lat1),math.radians(lat2)
            dp=math.radians(lat2-lat1); dl=math.radians(lng2-lng1)
            x=math.sin(dp/2)**2+math.cos(p1)*math.cos(p2)*math.sin(dl/2)**2
            return 2*R*math.asin(math.sqrt(x))
          def nearby(radius):
            out=[]
            for r in a.get('wolse',[]):
              try: ar=float(r.get('a') or 0)
              except: continue
              if abs(ar-30)>8: continue
              xy=geo.get(f"{r.get('u','')} {r.get('j','')}")
              if not xy: continue
              d=dist(lat0,lng0,float(xy[0]),float(xy[1]))
              if d<=radius:
                out.append((d,r))
            return sorted(out,key=lambda z:z[0])
          n500=nearby(500); n800=nearby(800)
          apt=json.loads(Path('gangseo_apt_summary.json').read_text(encoding='utf-8'))
          complexes=apt.get('complexes',[])
          apt_geo=[c for c in complexes if c.get('lat') and c.get('lng')]
          names=['강서힐스테이트','화곡푸르지오','등촌동아이파크','마곡엠밸리9단지','방화5']
          samples=[]
          for q in names:
            hit=next((c for c in complexes if q.replace(' ','') in str(c.get('nm') or c.get('name') or '').replace(' ','')),None)
            samples.append({'query':q,'found':bool(hit),'name':(hit or {}).get('nm') or (hit or {}).get('name'),'lat':(hit or {}).get('lat'),'lng':(hit or {}).get('lng')})
          report={
            'updated':a.get('updated'),
            'geo_keys':len(geo),
            'rentals':len(rent),
            'rental_with_jibun':len(with_j),
            'rental_with_coordinates':len(with_geo),
            'rental_geo_ratio':round(len(with_geo)/len(with_j),4) if with_j else 0,
            'hwagok_station_30m2_monthly_500m':len(n500),
            'hwagok_station_30m2_monthly_800m':len(n800),
            'hwagok_500_samples':[{'distance_m':round(d),'dong':r.get('u'),'jibun':r.get('j'),'type':r.get('t'),'area':r.get('a'),'deposit':r.get('dp'),'rent':r.get('m'),'ym':r.get('ym'),'day':r.get('d'),'building':r.get('b')} for d,r in n500[:5]],
            'apartment_complexes':len(complexes),
            'apartment_with_coordinates':len(apt_geo),
            'apartment_samples':samples,
          }
          Path('geo-live-diagnostic.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          assert len(with_j)>1000
          assert len(with_geo)>1000
          assert len(n800)>0
          assert len(apt_geo)>600
          PY
      - name: Commit diagnostic report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add geo-live-diagnostic.json
          git commit -m "test: verify current geo coverage" || exit 0
          git pull --rebase --autostash || true
          git push
