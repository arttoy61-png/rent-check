# ─────────────────────────────────────────────────────────────
# 원장 복구 전용 · 일회성 워크플로
#
# 2026.08.12 덮어쓰기 사고로 molit_kangseo.csv 가 4개월치로 잘렸다.
# automation/data/cache/ 에 남아 있는 월별 API 응답 캐시를 읽어
# 원장을 되살린다. API 는 호출하지 않는다.
#
# 정기 워크플로(update-data.yml)는 건드리지 않는다.
# ★ 복구 완료를 확인한 뒤 이 파일은 삭제할 것.
# ─────────────────────────────────────────────────────────────
name: Rebuild CSV from cache (one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency: update-data   # 정기 수집과 동시 실행 방지

env:
  TZ: Asia/Seoul

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      # 레포에 커밋된 캐시 외에 Actions 캐시에 더 있을 수 있으므로 같이 복원한다.
      - name: Restore MOLIT cache
        uses: actions/cache@v4
        with:
          path: |
            automation/data/cache
            automation/data/geocode_cache.json
          key: molit-cache-${{ github.run_id }}
          restore-keys: |
            molit-cache-

      # 커밋되는 원장은 레포 루트에만 있다. 복구 대상은 automation/data/ 쪽이므로
      # 반드시 먼저 복사해와야 한다. (이 단계 누락이 이번 사고의 원인이었다)
      - name: Seed previous CSV
        run: |
          mkdir -p automation/data
          if [ ! -f automation/data/molit_kangseo.csv ] && [ -f molit_kangseo.csv ]; then
            cp molit_kangseo.csv automation/data/molit_kangseo.csv
            echo "이전 CSV 복원: $(wc -l < automation/data/molit_kangseo.csv)행"
          else
            echo "복원 생략 (이미 있거나 루트에 CSV 없음)"
          fi

      - name: Rebuild from cache
        working-directory: automation
        run: python rebuild_from_cache.py

      # 복구된 원장으로 위젯·탐색기·경매 데이터를 다시 굽는다.
      - name: Rebuild derived data
        working-directory: automation
        run: |
          python widget_data_builder.py data/molit_kangseo.csv 화곡동
          cp outputs/widget/widget_data.json ../widget_data.json
          python apt_widget_builder.py data/molit_kangseo.csv 화곡동
          cp outputs/widget/hwagok_apt_data.json ../hwagok_apt_data.json

      - name: Rebuild 강서 아파트 탐색기
        run: python gangseo_apt_builder.py automation/data/molit_kangseo.csv .


      - name: Publish CSV
        run: |
          cp automation/data/molit_kangseo.csv molit_kangseo.csv
          cp automation/data/molit_kangseo_backup_*.csv . 2>/dev/null || true
          echo "최종 행수: $(wc -l < molit_kangseo.csv)"

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add molit_kangseo.csv molit_kangseo_backup_*.csv \
                  widget_data.json hwagok_apt_data.json \
                  gangseo_apt_summary.json gangseo_apt_detail.json 2>/dev/null || true
          git commit -m "fix: 캐시에서 원장 복구 (2026.02~08)" || echo "변경 없음"
          git pull --rebase --autostash || true
          git push || echo "푸시 생략"
