name: Refresh isolated redevelopment map feed
on:
  push:
    branches: [main]
    paths: ['.github/workflows/redevelopment-source.yml']
  pull_request:
    branches: [main]
    paths:
      - 'automation/redevelopment/**'
      - '.github/workflows/redevelopment-source.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 19 * * *' # 04:17 Asia/Seoul
permissions:
  contents: write
concurrency:
  group: redevelopment-isolated-source-v1
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        context: [local, push, workflow_dispatch, schedule]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Test with explicit parent execution context (no network or secrets)
        env:
          TEST_PARENT_CONTEXT: ${{ matrix.context }}
        run: |
          if [ "$TEST_PARENT_CONTEXT" = local ]; then
            env -u GITHUB_ACTIONS -u GITHUB_EVENT_NAME python -m unittest discover -s automation/redevelopment -p 'test_*.py'
          else
            GITHUB_ACTIONS=true GITHUB_EVENT_NAME="$TEST_PARENT_CONTEXT" python -m unittest discover -s automation/redevelopment -p 'test_*.py'
          fi
  refresh:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Validate collector and durable-budget tests without network
        run: python -m unittest discover -s automation/redevelopment -p 'test_*.py'
      - name: Collect strictly and update only isolated state and map feed
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: >-
          python automation/redevelopment/isolated_refresh.py
          --repo "$GITHUB_WORKSPACE"
          --temp "$RUNNER_TEMP/redevelopment"
          --address-limit 598
      - name: Report sanitized collection failure counts without raw source
        if: failure()
        run: |
          python - <<'PY'
          from collections import Counter
          from pathlib import Path
          import json, os, re
          root = Path(os.environ['RUNNER_TEMP']) / 'redevelopment' / 'source'
          allowed = {
              'invalid_xml', 'invalid_pagination_metadata', 'pagination_metadata_mismatch',
              'invalid_contract_date', 'contract_outside_requested_period',
              'district_code_mismatch', 'total_count_changed_during_pagination',
              'repeated_page', 'more_rows_than_total', 'short_page_before_total',
              'request_budget_exhausted', 'transport_TimeoutError',
              'transport_URLError', 'transport_ConnectionResetError',
              'transport_RemoteDisconnected', 'transport_IncompleteRead'
          }
          counts = Counter()
          complete = failed = 0
          for path in sorted(root.glob('run-*/*.json')):
              if not re.fullmatch(r'[0-9]{5}_[0-9]{6}_[0-5]\.json', path.name):
                  continue
              try:
                  part = json.loads(path.read_text(encoding='utf-8'))
              except (OSError, ValueError):
                  counts['unreadable_partition_record'] += 1
                  continue
              if part.get('complete') is True:
                  complete += 1
                  continue
              failed += 1
              error = part.get('error')
              if not isinstance(error, str):
                  error = 'unknown_collection_error'
              elif error not in allowed and not re.fullmatch(r'(?:http_[1-5][0-9]{2}|api_code_[0-9]{1,3})', error):
                  error = 'other_redacted_collection_error'
              counts[error] += 1
          # Only enumerated errors and counts: no URLs, keys, raw items or addresses.
          print(json.dumps({'diagnostic': 'collection_failure_summary',
              'expected_partitions': 450, 'complete_partition_records': complete,
              'failed_partition_records': failed, 'error_counts': dict(counts)},
              ensure_ascii=False))
          PY
      # Raw source and response bodies stay in runner temp. No upload-artifact step.
